<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Hard Shadow -->
  <rect x="8" y="8" width="48" height="48" rx="16" fill="#1E293B"/>
  
  <!-- Main Badge -->
  <rect x="4" y="4" width="48" height="48" rx="16" fill="#8B5CF6" stroke="#1E293B" stroke-width="3"/>
  
  <!-- Sound Wave Left (Mint) -->
  <path d="M12 28v8" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
  <path d="M17 22v20" stroke="#34D399" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Sound Wave Right (Hot Pink) -->
  <path d="M39 22v20" stroke="#F472B6" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M44 28v8" stroke="#F472B6" stroke-width="3" stroke-linecap="round"/>

