  <line x1="28" y1="35" x2="28" y2="42" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="42" x2="34" y2="42" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- Sparkle Star in Top-Right -->
